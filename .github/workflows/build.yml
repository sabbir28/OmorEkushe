name: Build & Verify OmorEkushe

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    name: Build (MSVC & MinGW)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, mingw]
        build_type: [Release]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up MSVC
      if: matrix.compiler == 'msvc'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set up Rust for MinGW
      if: matrix.compiler == 'mingw'
      run: rustup target add x86_64-pc-windows-gnu

    - name: Configure CMake (MSVC)
      if: matrix.compiler == 'msvc'
      run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DOMOREKUSHE_BUILD_LAYOUT_EDITOR=ON

    - name: Configure CMake (MinGW)
      if: matrix.compiler == 'mingw'
      run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DOMOREKUSHE_BUILD_LAYOUT_EDITOR=ON

    - name: Build Executables
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Run Unit Tests (CTest)
      shell: powershell
      run: |
        ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OmorEkushe-${{ matrix.compiler }}-${{ matrix.build_type }}
        path: |
          build/bin/*.exe
          build/bin/*.dll
          data/**

  build-linux:
    name: Build (Ubuntu Linux - X11 & Wayland)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxtst-dev libxi-dev xorg-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOMOREKUSHE_BUILD_LAYOUT_EDITOR=OFF

    - name: Build Executables
      run: cmake --build build -j$(nproc)

    - name: Run Unit Tests (CTest)
      run: ctest --test-dir build --output-on-failure

    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OmorEkushe-Linux
        path: |
          build/bin/OmorEkushe
          build/bin/PhoneticTests
          data/**

  build-macos:
    name: Build (macOS - InputMethodKit)
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOMOREKUSHE_BUILD_LAYOUT_EDITOR=OFF

    - name: Build Executables
      run: cmake --build build -j$(sysctl -n hw.ncpu)

    - name: Run Unit Tests (CTest)
      run: ctest --test-dir build --output-on-failure

    - name: Upload macOS Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OmorEkushe-macOS
        path: |
          build/bin/OmorEkushe.app
          build/bin/PhoneticTests
          data/**
