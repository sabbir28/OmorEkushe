name: Release OmorEkushe Executables

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Binaries
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DBIJOY_BUILD_LAYOUT_EDITOR=ON

    - name: Build All Executables
      run: |
        cmake --build build --config Release

    - name: Prepare Release Directories
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path release_stage
        
        # When using Visual Studio CMake generator, binaries are placed under build/bin/Release/
        # Copy them into build/bin/ so Inno Setup and portable packaging find them reliably
        if (Test-Path "build/bin/Release") {
          Write-Host "Copying Release binaries from build/bin/Release/ to build/bin/..."
          Copy-Item -Recurse -Force build/bin/Release/* build/bin/
        }

    - name: Build Inno Setup Installer
      shell: powershell
      run: |
        $version = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF.Substring(10).TrimStart('v') } else { "1.1.0" }
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) {
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        }
        & $iscc "/DMyAppVersion=$version" setup/OmorEkushe.iss

    - name: Package Portable Distribution
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path portable_pack/bin
        New-Item -ItemType Directory -Force -Path portable_pack/data
        
        Copy-Item -Recurse -Force build/bin/*.exe portable_pack/bin/ -Exclude "PhoneticTests.exe"
        Copy-Item -Recurse -Force build/bin/*.dll portable_pack/bin/
        if (Test-Path "build/data") {
          Copy-Item -Recurse -Force build/data/* portable_pack/data/
        }
        
        Compress-Archive -Path portable_pack/* -DestinationPath release_stage/OmorEkushe-Portable.zip -Force

    - name: Create / Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && format('OmorEkushe Release {0}', github.ref_name) || 'OmorEkushe Latest Release' }}
        draft: false
        prerelease: false
        make_latest: true
        files: |
          release_stage/OmorEkushe-Setup.exe
          release_stage/OmorEkushe-Portable.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

